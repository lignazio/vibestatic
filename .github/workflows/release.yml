name: release

# Su tag. Lo zip che finisce allegato alla release e` costruito QUI, dallo
# stesso `tools/build_release.sh` che si usa in locale: uno zip caricato a mano
# e` uno zip che nessuno ha verificato, e la differenza fra i due si scopre solo
# quando qualcuno lo installa.
#
# Non si ricade sullo zipball che GitHub genera da se`: quello si scompatta in
# una cartella `lignazio-vibestatic-<sha>`, quindi WordPress installerebbe il
# plugin li` dentro invece che in `vibestatic/`. E` la ragione per cui
# src/Updater.php cerca un asset e non usa `zipball_url`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da pubblicare (es. v8.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Costruisci e pubblica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring, simplexml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Il tag e` la cosa che la gente installa: se non corrisponde alla
      # versione dichiarata nel plugin, chi scarica `v8.1.0` si ritrova un
      # plugin che dice 8.0.0, e l'updater non offrira` mai l'aggiornamento
      # successivo perche` il confronto fra versioni parte dall'header.
      # build_release.sh gia` verifica che header e costante coincidano; qui si
      # aggiunge il terzo, che e` il tag.
      # Il valore passa da `env:` e non interpolato dentro lo script: un
      # `${{ }}` in mezzo al bash viene sostituito PRIMA che la shell parta,
      # quindi il contenuto diventa codice invece che dato. Qui l'input lo puo'
      # scrivere solo chi ha accesso in scrittura, ma la regola non ha eccezioni
      # utili da ricordare.
      - name: Il tag corrisponde alla versione del plugin
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="$(grep -m1 -E '^\s*\*\s*Version:' vibestatic.php \
            | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Il tag e' $TAG ma il plugin dichiara $VERSION (atteso: v$VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      # Prima di pubblicare, non dopo. Una release e` immutabile per chi l'ha
      # gia` scaricata.
      - name: Test
        run: composer run-script test

      - name: Costruisci lo zip
        run: composer run-script build

      # `gh` e` preinstallato sui runner: nessuna action di terzi da fidarsi e
      # da tenere pinnata a un SHA, che e` la stessa scelta gia` fatta per
      # shellcheck in quality.yml.
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Un prerelease non viene servito da `releases/latest`, quindi
          # l'updater non lo propone ai siti in produzione: e' il comportamento
          # che si vuole per una -alpha, -beta, -rc o -dev.
          case "$version" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac

          gh release create "$TAG" \
            "dist/vibestatic-$version.zip" \
            --title "VibeStatic $version" \
            --generate-notes \
            $PRERELEASE
