name: release

# On a tag. The zip attached to the release is built HERE, by the same
# `tools/build_release.sh` used locally: a zip uploaded by hand is a zip nobody
# verified, and the difference between the two only shows up when somebody
# installs it.
#
# There is no falling back on the zipball GitHub generates itself: that unpacks
# into a `lignazio-vibestatic-<sha>` directory, so WordPress would install the
# plugin in there rather than in `vibestatic/`. It is why src/Updater.php looks
# for an asset and does not use `zipball_url`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v8.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring, simplexml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # The tag is what people install: if it does not match the version
      # declared in the plugin, whoever downloads `v8.1.0` ends up with a plugin
      # that says 8.0.0, and the updater will never offer the next update
      # because the version comparison starts from the header. build_release.sh
      # already checks that header and constant agree; this adds the third one,
      # the tag.
      # The value goes through `env:` rather than being interpolated inside the
      # script: a `${{ }}` in the middle of bash is substituted BEFORE the shell
      # starts, so its content becomes code rather than data. Here only someone
      # with write access can set the input, but the rule has no exceptions
      # worth remembering.
      - name: Tag matches the plugin version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="$(grep -m1 -E '^\s*\*\s*Version:' vibestatic.php \
            | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Il tag e' $TAG ma il plugin dichiara $VERSION (atteso: v$VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      # Before publishing, not after. A release is immutable for anyone who has
      # already downloaded it.
      - name: Test
        run: composer run-script test

      - name: Build the zip
        run: composer run-script build

      # `gh` is preinstalled on the runners: no third-party action to trust and
      # keep pinned to a SHA, the same choice already made for shellcheck in
      # quality.yml.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # A prerelease is not served by `releases/latest`, so the updater
          # does not offer it to production sites: the behaviour wanted for an
          # -alpha, -beta, -rc or -dev.
          case "$version" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac

          gh release create "$TAG" \
            "dist/vibestatic-$version.zip" \
            --title "VibeStatic $version" \
            --generate-notes \
            $PRERELEASE
