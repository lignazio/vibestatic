name: quality

# Sostituisce codequality.yml, che non partiva più: usava actions/checkout@v2 e
# actions/cache@v1, entrambe disattivate da GitHub, quindi ogni job falliva al
# primo passo. Usava anche due action puntate a un branch mutabile
# (ludeeus/action-shellcheck@master, john-shaffer/cache@sudo-tar), cioè codice
# di terzi che poteva cambiare sotto i piedi fra un run e l'altro.

on:
  push:
    branches: [main, develop, vibestatic]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Analisi statica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # L'analisi statica gira su una versione sola: PHPStan legge il codice,
          # non lo esegue, e `phpVersion` nel suo config dice già quale target
          # considerare. Ripeterla sulla matrice sarebbe tre volte lo stesso lavoro.
          php-version: '8.2'
          extensions: dom, libxml, mbstring, simplexml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --strict

      # Bloccante. Sono i cinque sniff che la configurazione originale
      # escludeva — SQL preparato, nonce, escaping, input sanificato — cioè
      # esattamente quelli che avrebbero trovato ogni difetto dell'audit. Sono
      # a zero dalla fine della fase 3 e devono restarci: se questo passo
      # diventa rosso, è una regressione di sicurezza, non un debito di stile.
      - name: Sicurezza (bloccante)
        run: composer run-script phpcs-security

      # Non bloccante, e senza scadenza dichiarata: sono 422 violazioni di
      # documentazione e stile, che si smaltiscono nel refactoring della fase 5
      # invece che in un passaggio a parte. Sta dopo quello di sicurezza e in un
      # passo suo di proposito: un unico phpcs rosso per la documentazione
      # mancante renderebbe invisibile una SQLi nuova nello stesso output.
      - name: Stile e documentazione (non bloccante)
        continue-on-error: true
        run: composer run-script phpcs

      - name: Compatibilità PHP 8.2+
        run: composer run-script phpcompat

      - name: PHPStan
        run: composer run-script phpstan

  tests:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, simplexml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Lint
        run: composer run-script lint

      # Solo la suite `unit`. Quella `external` scarica sitemap da siti di
      # terzi: in CI fallirebbe per ragioni che non riguardano questo codice.
      - name: Test
        run: composer run-script phpunit

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        # Preinstallato sui runner Ubuntu: una dipendenza esterna in meno, e
        # nessuna action di terzi puntata a un branch mutabile.
        run: shellcheck tools/*.sh
