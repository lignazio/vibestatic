name: quality

# Replaces codequality.yml, which no longer started: it used actions/checkout@v2
# and actions/cache@v1, both disabled by GitHub, so every job failed at its
# first step. It also used two actions pointed at a mutable branch
# (ludeeus/action-shellcheck@master, john-shaffer/cache@sudo-tar) — third-party
# code that could change underfoot between one run and the next.

on:
  push:
    branches: [main, develop, vibestatic]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Static analysis runs on one version only: PHPStan reads the code
          # rather than running it, and `phpVersion` in its config already says
          # which target to consider. Repeating it across the matrix would be
          # the same work three times.
          php-version: '8.2'
          extensions: dom, libxml, mbstring, simplexml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Validate composer.json
        run: composer validate --strict

      # Blocking. These are the five sniffs the original configuration
      # excluded — prepared SQL, nonces, escaping, sanitised input — that is,
      # exactly the ones that would have found every defect in the audit. They
      # have been at zero since the security pass and must stay there: if this
      # step goes red it is a security regression, not style debt.
      - name: Security (blocking)
        run: composer run-script phpcs-security

      # Non-blocking, and with no declared deadline: these are 422 style and
      # documentation violations, cleared as the files get rewritten rather than
      # in a pass of their own. It sits after the security step and in a step of
      # its own deliberately: one phpcs going red over missing documentation
      # would make a new SQLi invisible in the same output.
      - name: Style and documentation (non-blocking)
        continue-on-error: true
        run: composer run-script phpcs

      # Blocking like the security step, and for a similar reason: a string
      # wrapped with the wrong domain does not show until somebody installs a
      # translation, that is, never during development in English.
      - name: i18n (blocking)
        run: composer run-script phpcs-i18n

      - name: PHP 8.2+ compatibility
        run: composer run-script phpcompat

      - name: PHPStan
        run: composer run-script phpstan

  tests:
    name: Tests, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, simplexml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Lint
        run: composer run-script lint

      # The `unit` suite only. The `external` one downloads sitemaps from
      # third-party sites: in CI it would fail for reasons unrelated to this
      # code.
      - name: Test
        run: composer run-script phpunit

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        # Preinstalled on the Ubuntu runners: one external dependency fewer,
        # and no third-party action pointed at a mutable branch.
        run: shellcheck tools/*.sh

  pot:
    name: The .pot is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring, simplexml
          coverage: none
          tools: composer:v2, wp-cli

      # The .pot lives in the repository because it is the file a translator
      # opens. The flip side is that it can fall behind the code with nothing
      # to flag it: a new string simply never reaches whoever translates. Here
      # it is regenerated and compared.
      #
      # `POT-Creation-Date` changes on every run by construction, so it is
      # stripped from both sides before the diff: otherwise this step would be
      # red always, and would become noise to ignore.
      # One file now, the modules included. There used to be a list, and the
      # sftp add-on's was never on it: its own .pot could drift for as long as
      # nobody looked. A single domain removes the list and the thing that can
      # be forgotten from it.
      - name: Regenerate and compare
        run: |
          cp languages/vibestatic.pot /tmp/expected.pot

          composer run-script i18n

          without_date() { grep -v '^"POT-Creation-Date:' "$1"; }

          if ! diff -u <(without_date /tmp/expected.pot) \
                       <(without_date languages/vibestatic.pot); then
            echo "::error file=languages/vibestatic.pot::The .pot does not match the code. Run 'composer i18n' and commit."
            exit 1
          fi
        shell: bash
