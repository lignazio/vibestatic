# So that in three years this project does not find itself back where it
# started: WP2Static shipped a fork of Guzzle frozen at 2020, without the
# security patches published after that date, and nobody noticed because nobody
# was looking.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dev dependencies move often and on their own reach no user: grouping them
    # keeps the PR that matters — the one on Guzzle, the only production
    # dependency — separate from the noise.
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
